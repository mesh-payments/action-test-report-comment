name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: [dev-arm-small]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          package-manager-cache: false
          node-version: 20
          cache: npm

      - name: CodeArtifact login
        if: vars.CODEARTIFACT_NPM_DISABLED != 'true'
        uses: mesh-payments/gh-workflows/.github/actions/codeartifact-npm-login@v1

      - run: npm ci

      - run: npm run lint

      - run: npm test

      # Rebuild dist/ and fail if the working tree is dirty afterwards.
      # JavaScript actions ship their bundled output (dist/index.js) —
      # consumers reference it via the `runs.main` path in action.yml,
      # so out-of-date dist/ means the action runs stale code while
      # src/ looks current. This check enforces the rebuild discipline.
      - run: npm run build
      - name: Verify dist/ is up to date
        run: |
          if ! git diff --quiet -- dist; then
            echo "::error::dist/ is out of date. Run \`npm run build\` and commit the result."
            git diff -- dist | head -100
            exit 1
          fi
